# Bootstrap vhost for the National Skill Passport registry - nsp.ppmc.pk
#
# HTTP only. Installed on a host that has no certificate yet, so that
# nginx -t passes and certbot can reach /.well-known/acme-challenge/ over
# port 80. install-on-vps.sh swaps this for nsp.ppmc.pk.conf once the
# certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name nsp.ppmc.pk;

    client_max_body_size 2m;

    # Must come before the catch-all proxy: the ACME challenge is a real file
    # on disk, not something the Node app can answer. Serving it from the app
    # is what made the first certbot run fail with a 404.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
