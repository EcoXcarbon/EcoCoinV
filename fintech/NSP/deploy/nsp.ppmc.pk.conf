# nginx site for the National Skill Passport registry - nsp.ppmc.pk
#
# TLS listener note. On the ppmc.pk VPS public :443 is owned by an SNI
# multiplexer defined in nginx.conf (stream block, ssl_preread + proxy_protocol)
# which forwards to 127.0.0.1:8443. HTTPS vhosts therefore terminate TLS on
# 127.0.0.1:8443 with proxy_protocol, exactly as tl.ppmc.pk, ae.ppmc.pk and
# academiq.ppmc.pk do. A plain "listen 443 ssl" block is never reached on that
# host: requests fall through to the first block on :8443 and are answered by
# the wrong site with the wrong certificate.
#
# install-on-vps.sh rewrites the listen line below to a normal "listen 443 ssl"
# if the host has no multiplexer, so this file also works on a plain server.
server {
    server_name nsp.ppmc.pk;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate     /etc/letsencrypt/live/nsp.ppmc.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nsp.ppmc.pk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Port 80 stays open for ACME renewals; everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name nsp.ppmc.pk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
